<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="gambar6/logo.png" alt="" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">rCodeid</span>
            <span class="job">Web Design  &  Fullstack</span>
        </div>

        <div class="media-buttons">
            <a href="#" style="background: #4267b2"class="link">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="#" style="background: #1da1f2" class="link">
                <i class="fa-brands fa-twitter"></i>
            </a>
            <a href="#" style="background: #e1306c" class="link">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" style="background: #181717"class="link">
                <i class="fa-brands fa-github"></i>
            </a>
        </div>

        <div class="buttons">
            <button class="button">Follow</button>
            <button class="button">message</button>
        </div>

        <div class="analytics">
            <div class="data">
                <i class="fa-regular fa-heart"></i>
                <span class="number">80k</span>
            </div>
            <div class="data">
                <i class="fa-regular fa-message"></i>
                <span class="number">30k</span>
            </div>
            <div class="data">
                <i class="fa-solid fa-share"></i>
                <span class="number">10k</span>
            </div>
        </div>
    </div>
</body>
</html>
